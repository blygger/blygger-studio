name: Release
# Releases are cut by pushing a tag (git tag v0.10.0 && git push origin v0.10.0),
# not by every push to main: doc-only commits land on main routinely, and
# `npm run upgrade` and the update alert follow release tags, so a release is
# what reaches other operators' nodes. The tag must name package.json's version.
on:
  push:
    tags: ["v*.*.*"]
concurrency:
  group: publish-release
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      actions: read
    outputs:
      tested: ${{ steps.checked.outputs.tested }}
      tag: ${{ steps.version.outputs.tag }}
      deadline: ${{ steps.deadline.outputs.value }}
    steps:
      - id: deadline
        run: echo "value=$(( $(date +%s) * 1000 + 75 * 60000 ))" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.18.0
      - run: node scripts/check-release.ts
        env:
          RELEASE_RETRY_COMMIT: ${{ github.sha }}
      - name: Read release version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      # The tests already ran on this commit when it reached main: Check runs
      # every job on a push to main. Rerunning them here doubled the time to a
      # release and let one flaky test fail it (v0.41.0). Wait for that run;
      # if it failed, stop; if the commit never went through main (a hotfix
      # tag on a branch), run the suite here instead.
      - name: Find this commit's Check run on main
        id: checked
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 120); do
            states=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/check.yml/runs?head_sha=$GITHUB_SHA&event=push" \
              --jq '[.workflow_runs[] | select(.head_branch == "main") | (.conclusion // .status)] | join(" ")')
            case " $states " in
              *" success "*) echo "Check passed on main for $GITHUB_SHA"; echo "tested=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
              *" queued "*|*" in_progress "*|*" waiting "*|*" pending "*|*" requested "*) sleep 30 ;;
              "  ") echo "No Check run on main for $GITHUB_SHA; running the suite here"; echo "tested=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
              *) echo "Check did not pass on main for $GITHUB_SHA ($states). Re-run it, then re-run this release." >&2; exit 1 ;;
            esac
          done
          echo "Timed out waiting for Check on $GITHUB_SHA" >&2; exit 1
  formatting-baseline:
    needs: preflight
    if: needs.preflight.outputs.tested == 'false'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/formatting-baseline.yml
    with:
      timeout-minutes: 75
      deadline: ${{ needs.preflight.outputs.deadline }}
  release:
    if: >-
      always() && !cancelled() && needs.preflight.result == 'success' &&
      ((needs.preflight.outputs.tested == 'true' && needs.formatting-baseline.result == 'skipped') ||
       (needs.preflight.outputs.tested == 'false' && needs.formatting-baseline.result == 'success'))
    needs: [preflight, formatting-baseline]
    env:
      RELEASE_DEADLINE: ${{ needs.preflight.outputs.deadline }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run release:check
        env:
          RELEASE_RETRY_COMMIT: ${{ github.sha }}
      - name: Read release version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - run: npm run sdk:generate
      - run: npm run typecheck
      - run: npm run lint:oracles
      - run: npm run check:oracle-migration
      - run: git diff --exit-code -- openapi.json sdk/generated sdk/generation.json
      # Match Check's native SQLite oracle provider, including embedded NUL text.
      - if: needs.preflight.outputs.tested != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.19.0
      - if: needs.preflight.outputs.tested != 'true'
        run: npm run test:oracles:studio
      - if: needs.preflight.outputs.tested != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.18.0
      - if: needs.preflight.outputs.tested != 'true'
        run: npm run test:oracles:conditional:worker
      - if: needs.preflight.outputs.tested != 'true'
        run: npm run test:oracles:contracts
      - if: needs.preflight.outputs.tested != 'true'
        run: npm run test:oracles:search
      - if: needs.preflight.outputs.tested != 'true'
        run: npm run test:oracles:runtime
      - if: needs.preflight.outputs.tested != 'true'
        run: npm run test:oracles:worker
      - if: needs.preflight.outputs.tested != 'true'
        run: npm run test:ui -- --maxWorkers=2
      - run: npx playwright install --with-deps chromium
      - if: needs.preflight.outputs.tested != 'true'
        run: npm test -- --maxWorkers=2
      - if: needs.preflight.outputs.tested != 'true'
        run: npm run test:upgrade
      - if: needs.preflight.outputs.tested != 'true'
        run: npm run test:mutations
      # release:verify drives Chromium; the touch toast regression uses WebKit.
      - if: needs.preflight.outputs.tested != 'true'
        run: npx playwright install --with-deps webkit
      - if: needs.preflight.outputs.tested != 'true'
        run: npm run test:e2e
      - if: needs.preflight.outputs.tested != 'true'
        run: npm run test:oracles:browser
      - if: needs.preflight.outputs.tested != 'true'
        run: npm run test:oracles:browser:search
      - name: Check the original release deadline
        run: node -e 'if (Date.now() >= Number(process.env.RELEASE_DEADLINE)) process.exit(1)'
      - run: npm run release:build
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
      - run: npm run release:verify
      - name: Publish downloads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          node -e 'if (Date.now() >= Number(process.env.RELEASE_DEADLINE)) process.exit(1)'
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$RELEASE_COMMIT" --generate-notes --draft
          fi
          gh release upload "$RELEASE_TAG" build/release/*.json build/release/*.tgz build/release/*.tar.gz build/release/SHA256SUMS --clobber
          gh release edit "$RELEASE_TAG" --draft=false
