name: Release
# Releases are cut by pushing a tag (git tag v0.10.0 && git push origin v0.10.0),
# not by every push to main: doc-only commits land on main routinely, and
# `npm run upgrade` and the update alert follow release tags, so a release is
# what reaches other operators' nodes. The tag must name package.json's version.
on:
  push:
    tags: ["v*.*.*"]
concurrency:
  group: publish-release
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci
      - run: npm run release:check
        env:
          RELEASE_RETRY_COMMIT: ${{ github.sha }}
      - name: Read release version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      # The tests already ran on this commit when it reached main: Check runs
      # every job on a push to main. Rerunning them here doubled the time to a
      # release and let one flaky test fail it (v0.41.0). Wait for that run;
      # if it failed, stop; if the commit never went through main (a hotfix
      # tag on a branch), run the suite here instead.
      - name: Find this commit's Check run on main
        id: checked
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 120); do
            states=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/check.yml/runs?head_sha=$GITHUB_SHA&event=push" \
              --jq '[.workflow_runs[] | select(.head_branch == "main") | (.conclusion // .status)] | join(" ")')
            case " $states " in
              *" success "*) echo "Check passed on main for $GITHUB_SHA"; echo "tested=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
              *" queued "*|*" in_progress "*|*" waiting "*|*" pending "*|*" requested "*) sleep 30 ;;
              "  ") echo "No Check run on main for $GITHUB_SHA; running the suite here"; echo "tested=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
              *) echo "Check did not pass on main for $GITHUB_SHA ($states). Re-run it, then re-run this release." >&2; exit 1 ;;
            esac
          done
          echo "Timed out waiting for Check on $GITHUB_SHA" >&2; exit 1
      - run: npm run sdk:generate
      - run: npm run typecheck
      - run: git diff --exit-code -- openapi.json sdk/generated sdk/generation.json
      - if: steps.checked.outputs.tested != 'true'
        run: npm run test:ui -- --maxWorkers=2
      - if: steps.checked.outputs.tested != 'true'
        run: npm test -- --maxWorkers=2
      - if: steps.checked.outputs.tested != 'true'
        run: npm run test:upgrade
      - if: steps.checked.outputs.tested != 'true'
        run: npm run test:mutations
      # verify-sdk-consumer.ts, inside release:verify, drives Chromium.
      - run: npx playwright install --with-deps chromium
      - if: steps.checked.outputs.tested != 'true'
        run: npm run test:e2e
      - run: npm run release:build
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
      - run: npm run release:verify
      - name: Publish downloads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$RELEASE_COMMIT" --generate-notes --draft
          fi
          gh release upload "$RELEASE_TAG" build/release/*.json build/release/*.tgz build/release/*.tar.gz build/release/SHA256SUMS --clobber
          gh release edit "$RELEASE_TAG" --draft=false
