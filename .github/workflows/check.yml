name: Check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run check:template
      # Schema, names and ranges only; fetching each entry's source is a reviewer's run.
      - run: npm run registry:check -- --offline
      - run: npm run release:build
      - run: npx playwright install --with-deps chromium
      - run: npm run release:verify
      - run: npm run openapi && git diff --exit-code -- openapi.json
      - run: npm run test:ui -- --maxWorkers=2
      - run: npm test -- --maxWorkers=2
      - run: npm run test:upgrade
      - run: npm run test:mutations
      - run: npm run test:polling-cache:mutations
      - run: npm run test:auth:security:mutations
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-failure-evidence
          path: |
            test-results/
            build/mutation-*.log
            build/polling-mutation-*.log
            build/security-mutant-*.log
  sdk-generation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci
      - run: npm run sdk:generate
      - run: git diff --exit-code -- openapi.json sdk/generated sdk/generation.json
