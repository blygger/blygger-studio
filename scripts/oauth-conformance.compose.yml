services:
  mongodb:
    image: mongo:6.0.28@sha256:8b6d8f5bbedb25cb73517b65cf99f13aeb75ad5b157a56c479287a840bbad3ac
  server:
    image: registry.gitlab.com/openid/conformance-suite:release-v5.3.5@sha256:576ad9d6ea4230a6d58623a03c17c74e2ae1438cceec252f8721daa53a705961
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      BASE_URL: https://localhost.emobix.co.uk:8443
      BASE_MTLS_URL: https://localhost.emobix.co.uk:8444
      MONGODB_HOST: mongodb
      SPRING_PROFILES_ACTIVE: dev
      OIDC_GOOGLE_CLIENTID: google-fixture
      OIDC_GOOGLE_SECRET: unused-fixture-secret
      OIDC_GITLAB_CLIENTID: gitlab-fixture
      OIDC_GITLAB_SECRET: unused-fixture-secret
    depends_on: [mongodb]
  nginx:
    image: registry.gitlab.com/openid/conformance-suite/nginx:release-v5.3.5@sha256:fd5ae05bf2a8f246f600b16a198dd670051bbad44f0b59d903da6e294e02707d
    ports: ["127.0.0.1:8443:8443"]
    networks:
      default:
        aliases: [localhost.emobix.co.uk]
    depends_on: [server]
